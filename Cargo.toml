[workspace]
members = [
    "crates/rnaa",
    "crates/rnaa-core",
    "crates/rnaa-stages",
    "crates/rnaa-formats",
]
exclude = ["vendor/fasterp"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.3.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
fasterp = { version = "0.2.1", default-features = false, features = ["native"] }
flate2 = "1.1.10"
hex = "0.4.3"
kallistors = "0.6.0"
libc = "0.2.191"
md-5 = "0.11.0"
mincorr = { git = "https://github.com/deminden/min-rust-corr", rev = "83d9ee4c5a099e24c3e0e4a3461ea893b72017d4" }
rsdeseq2 = "0.4.0"
rsfgsea = "0.4.0"
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
ndarray = { version = "0.17.2", features = ["serde"] }
num_cpus = "1.17.0"
once_cell = "1.21.4"
regex = "1.13.1"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.41.1", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
walkdir = "2.5.0"

[patch.crates-io]
fasterp = { path = "vendor/fasterp" }
