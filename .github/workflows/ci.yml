name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust: stable
          - os: ubuntu-24.04-arm
            rust: stable
          - os: ubuntu-24.04
            rust: 1.97.1
          - os: macos-15
            rust: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check release tag version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -c 'import os, tomllib; v = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]; assert os.environ["GITHUB_REF_NAME"] in (v, "v" + v), "Tag must match workspace version"'

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Vendored preprocessing library tests
        run: cargo test --manifest-path vendor/fasterp/Cargo.toml --lib --test compatibility_v140 --locked

      - name: Vendored preprocessing WebAssembly check
        run: cargo check --manifest-path vendor/fasterp/Cargo.toml --lib --target wasm32-unknown-unknown --no-default-features --features wasm --locked

      - name: Package verifier tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Verify package and source installation
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && matrix.rust == 'stable'
        run: |
          python3 scripts/package_candidate.py --label ci-${{ matrix.os }}-${{ matrix.rust }}
          python3 scripts/verify_candidate.py target/release-candidates/ci-${{ matrix.os }}-${{ matrix.rust }} --install-target-dir target

      - name: Transfer verified candidate to release job
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && matrix.rust == 'stable'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rnaa-candidate-${{ matrix.os }}-rust-${{ matrix.rust }}
          path: target/release-candidates/ci-${{ matrix.os }}-${{ matrix.rust }}/
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: rust
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag belongs to main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Download verified candidates
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: rnaa-candidate-*-rust-stable
          path: target/release-input

      - name: Assemble release assets
        run: python3 scripts/assemble_release.py target/release-input target/release-assets "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --draft --generate-notes)
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" target/release-assets/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
